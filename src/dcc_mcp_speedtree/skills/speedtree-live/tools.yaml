tools:
- name: live_status
  description: Read the exact bound Modeler window state and unverified document name. This pixels-only route exposes no full document path, accessibility tree or observable modal dialog.
  source_file: scripts/live_status.py
  execution: sync
  affinity: any
  enforce_thread_affinity: true
  annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false}
  timeout_hint_secs: 60
  input_schema:
    type: object
    properties:
      process_id: {type: integer, minimum: 1}
    additionalProperties: false
  output_schema: {type: object}
- name: live_screenshot
  description: Capture the exact bound Modeler window through the owned dcc-cua / DCC-MCP ui-control route and return the fresh native PNG path. Not a background capture; the window must be the bound PID/HWND.
  source_file: scripts/live_screenshot.py
  execution: sync
  affinity: any
  enforce_thread_affinity: true
  annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: false, open_world_hint: false}
  timeout_hint_secs: 60
  input_schema:
    type: object
    properties:
      process_id: {type: integer, minimum: 1}
      output_path: {type: string, minLength: 1, maxLength: 4096}
      scale: {type: number, minimum: 0.1, maximum: 1.0, default: 0.6}
    additionalProperties: false
  output_schema: {type: object}
- name: live_open
  description: Refused on the implemented pixels-only route with error=open_recent_unsupported_on_pixels_only_route. That route exposes no element targeting, so a File > Recents entry cannot be located or activated. An adapter capability gap, not a statement about the public protocol. Open the document with dcc-cua / DCC-MCP ui-control first.
  source_file: scripts/live_open.py
  execution: sync
  affinity: any
  enforce_thread_affinity: true
  annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: true, open_world_hint: false}
  timeout_hint_secs: 180
  input_schema:
    type: object
    required: [path]
    properties:
      path: {type: string, minLength: 1, maxLength: 4096}
      process_id: {type: integer, minimum: 1}
    additionalProperties: false
  output_schema: {type: object}
- name: live_save
  description: Unsupported on the implemented pixels-only adapter, returning error=active_document_binding_unverified before Save input, file/history mutation, reload or output work. No reliable full-document identity or save postcondition is available there. Caller flags, custom dictionaries, timestamps and hashes cannot unlock it. This refusal is not completed live co-design.
  source_file: scripts/live_save.py
  execution: sync
  affinity: any
  enforce_thread_affinity: true
  annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: true, open_world_hint: false}
  timeout_hint_secs: 180
  input_schema:
    type: object
    properties:
      process_id: {type: integer, minimum: 1}
    additionalProperties: false
  output_schema: {type: object}
- name: live_revert
  description: Deliver the configured File > Revert to saved command to the bound Modeler window and capture it. The reload effect is reported UNVERIFIED/UNKNOWN; unsaved GUI edits may be lost and no reload is claimed.
  source_file: scripts/live_revert.py
  execution: sync
  affinity: any
  enforce_thread_affinity: true
  annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: true, open_world_hint: false}
  timeout_hint_secs: 240
  input_schema:
    type: object
    properties:
      process_id: {type: integer, minimum: 1}
      settle_seconds: {type: number, minimum: 0, maximum: 60, default: 3}
    additionalProperties: false
  output_schema: {type: object}
- name: live_apply
  description: Unsupported on the implemented pixels-only adapter, returning error=active_document_binding_unverified before Save input, file/history mutation, reload or output work. No reliable full-document identity or save postcondition is available there. Caller flags, custom dictionaries, timestamps and hashes cannot unlock it. This refusal is not completed live co-design.
  source_file: scripts/live_apply.py
  execution: sync
  affinity: any
  enforce_thread_affinity: true
  annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: false, open_world_hint: false}
  timeout_hint_secs: 600
  input_schema:
    type: object
    required: [path, operations]
    properties:
      path: {type: string, minLength: 1, maxLength: 4096}
      operations:
        type: array
        minItems: 1
        maxItems: 256
        items: {type: object}
      process_id: {type: integer, minimum: 1}
      settle_seconds: {type: number, minimum: 0, maximum: 60, default: 3}
    additionalProperties: false
  output_schema: {type: object}
- name: live_undo
  description: Unsupported on the implemented pixels-only adapter, returning error=active_document_binding_unverified before Save input, file/history mutation, reload or output work. No reliable full-document identity or save postcondition is available there. Caller flags, custom dictionaries, timestamps and hashes cannot unlock it. This refusal is not completed live co-design.
  source_file: scripts/live_undo.py
  execution: sync
  affinity: any
  enforce_thread_affinity: true
  annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: false, open_world_hint: false}
  timeout_hint_secs: 600
  input_schema:
    type: object
    required: [path]
    properties:
      path: {type: string, minLength: 1, maxLength: 4096}
      process_id: {type: integer, minimum: 1}
      settle_seconds: {type: number, minimum: 0, maximum: 60, default: 3}
    additionalProperties: false
  output_schema: {type: object}
