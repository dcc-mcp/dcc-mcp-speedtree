name: checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12']
        # setup-python no longer ships CPython 3.9 for ubuntu-latest; keep
        # 3.9 coverage on a runner that still carries the 3.9 toolcache.
        exclude:
          - {os: ubuntu-latest, python: '3.9'}
          - {os: windows-latest, python: '3.9'}
        include:
          - {os: ubuntu-22.04, python: '3.9'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .[test]
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m pytest -q
      - run: python -m build
      - name: Verify installed wheel skill coverage
        shell: bash
        run: python scripts/check_wheel.py dist/*.whl
