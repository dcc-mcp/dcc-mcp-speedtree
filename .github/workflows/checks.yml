name: checks
on:
  # A push to a same-repo branch would otherwise start a second, identical run
  # while its pull_request run is already going, so pushes are scoped to main
  # only and every branch change is covered once by pull_request.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per pull request (or per ref for main pushes): a new commit supersedes
# the queued and running jobs of that group instead of stacking stale results.
# Runs on main are never cancelled, so the branch history stays green or red.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    # A hung or unreachable runner should be reported, not held for six hours.
    timeout-minutes: 20
    strategy:
      # The platforms are independent: one failing or missing toolcache must
      # still let the other legs report their own result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12']
        # setup-python no longer ships CPython 3.9 for ubuntu-latest; keep
        # 3.9 coverage on a runner that still carries the 3.9 toolcache.
        exclude:
          - {os: ubuntu-latest, python: '3.9'}
          - {os: windows-latest, python: '3.9'}
        include:
          - {os: ubuntu-22.04, python: '3.9'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[test]'
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m pytest -q
      - run: python -m build
      - name: Verify installed wheel skill coverage
        shell: bash
        run: python scripts/check_wheel.py dist/*.whl
